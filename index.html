<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYANVERSE</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stars"></div>
<div id="fireworks"></div>
<div id="confetti"></div>

<header>
    <h1 id="typing"></h1>
    <p>💛 Welcome To AYANVERSE 💛</p>
</header>

<section class="hero">

    <img src="profile.png" alt="Profile">

    <h2>Ayan Sangma</h2>

    <h3>🎂 Happy Birthday 🎂</h3>

    <h4>Dream Big 🚀</h4>

    <p>
        Believe in Yourself 💪 <br>
        Never Give Up 🚀
    </p>

    <button onclick="playMusic()">
        🎵 Play My Favourite Song
    </button>

</section>

<section class="countdown">
    <h2>⏳ Countdown</h2>

    <div id="timer"></div>
</section>

<section class="quote">
    💖 Quote 💖 <br>
    "The future belongs to those who never stop learning."
</section>

<section class="gift">
    <h2>🎁 Surprise 🎁</h2>

    <button>
        🎉 Open My Birthday Gift 🎉
    </button>

    <div id="giftText"></div>
</section>

<footer>
    Made with ❤️ by Ayan | © 2026 AYANVERSE
</footer>

<audio id="music" loop>
    <source src="Ed_Sheeran_-_Perfect(48k).m4a" type="audio/mp4">
</audio>

<script src="script.js"></script>

</body>
</html>
